<style>
  html, body { margin:0; height:100%; }

  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:520px; height:288px; }
  .brand { fill:var(--violet-500); }
  .tint { fill:var(--violet-100); }
  [data-theme="dark"] .tint, [data-theme="enterprise-dark"] .tint { fill:var(--violet-300); }
  .deep { fill:var(--violet-900); }
  .hi { fill:var(--violet-400); }
  .plus { fill:var(--violet-100); }
  .leaf { fill:var(--violet-400); }
  .blk { rx:var(--radius-lg); }
  .chip { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-10); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:700; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
