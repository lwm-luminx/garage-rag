@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<script id="app">
(function(){
  var raw = document.getElementById('state').textContent;
  var S = JSON.parse(raw);
  var LABEL = {mac:'Mac',rick:'Rick',idea:'Idea',progress:'Running'};
  var filter = 'all';
  var release = 'all';
  try { filter = localStorage.getItem('g15-filter') || 'all'; release = localStorage.getItem('g15-release') || 'all'; } catch(e){}
  var api = null, readOnly = false, timer = null, pending = false;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function inRelease(it, p){
    if (release === 'all') return true;
    var r = it.rel || p.rel;
    return r === release || r === 'both';
  }
  function shown(it){
    if (filter === 'all') return true;
    if (filter === 'open') return !it.done;
    return (it.tags||[]).indexOf(filter) >= 0;
  }
  function render(){
    document.getElementById('snapshot').textContent = S.snapshot;
    document.getElementById('foot').textContent = S.foot;
    var T = {devid:[0,0], store:[0,0]}, html = '';
    S.phases.forEach(function(p, pi){
      var pd = 0, pt = 0; p.items.forEach(function(it){
        if (inRelease(it, p)){ pt++; if (it.done) pd++; }
        var r = it.rel || p.rel;
        ['devid','store'].forEach(function(k){ if (r === k || r === 'both'){ T[k][1]++; if (it.done) T[k][0]++; } });
      });
      if (release !== 'all' && !p.items.some(function(it){ return inRelease(it, p); })) return;
      var rows = p.items.filter(function(it){ return inRelease(it, p) && shown(it); }).map(function(it){
        var tags = (it.tags||[]).map(function(t){ return '<span class="tag '+t+'">'+LABEL[t]+'</span>'; }).join('');
        if (it.done && it.at) tags += '<span class="tag when">Done '+esc(it.at)+'</span>';
        return '<li class="item'+(it.done?' done':'')+(p.review?' review':'')+'">'+
          '<input type="checkbox" id="cb-'+it.id+'" data-id="'+it.id+'"'+(it.done?' checked':'')+(readOnly?' disabled':'')+'>'+
          '<label class="text" for="cb-'+it.id+'"><span class="t">'+it.t+'</span>'+
          (it.n?'<span class="note">'+esc(it.n)+'</span>':'')+
          (it.w?'<span class="who"><b>Who:</b> '+esc(it.w)+'</span>':'')+
          (tags?'<span class="tags">'+tags+'</span>':'')+'</label></li>';
      }).join('');
      html += '<section class="phase" id="'+p.id+'"><div class="phase-head"><span class="phase-num">'+(p.review?'R':String(pi+1))+'</span><h2>'+esc(p.title)+'</h2><span class="count">'+pd+' of '+pt+'</span></div>'+
        (p.sub?'<p class="phase-sub">'+esc(p.sub)+'</p>':'')+
        '<ul class="items">'+(rows||'<li class="empty">Nothing here matches this filter.</li>')+'</ul></section>';
    });
    document.getElementById('phases').innerHTML = html;
    ['devid','store'].forEach(function(k){
      var d = T[k][0], t = T[k][1];
      document.getElementById('num-'+k).innerHTML = d+' <small>of '+t+'</small>';
      document.getElementById('bar-'+k).style.width = (t? (100*d/t):0)+'%';
    });
    document.getElementById('meter-key').textContent = S.meterKey || '';
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){ b.setAttribute('aria-pressed', (b.dataset.f ? b.dataset.f===filter : b.dataset.r===release)?'true':'false'); });
    document.getElementById('ro').hidden = !readOnly;
  }
  function setSave(t, err){ var el=document.getElementById('save'); el.textContent=t; el.className='save'+(err?' err':''); }

  function buildDoc(){
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('app').textContent;
    var fonts = document.getElementById('fonts').getAttribute('href');
    var body = document.querySelector('.wrap').cloneNode(true);
    body.querySelector('#phases').innerHTML = '';
    ['snapshot','num-devid','num-store','meter-key','save','foot'].forEach(function(id){ var e=body.querySelector('#'+id); if(e) e.textContent=''; });
    body.querySelector('#save').className = 'save';
    ['#bar-devid','#bar-store'].forEach(function(q){ body.querySelector(q).removeAttribute('style'); });
    var ro = body.querySelector('#ro'); ro.setAttribute('hidden','');
    Array.prototype.forEach.call(body.querySelectorAll('.chip'), function(b){ b.removeAttribute('aria-pressed'); });
    var json = JSON.stringify(S, null, 1).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'+
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
      '<title>'+esc(document.title)+'</title>'+
      '<link rel="preconnect" href="https://fonts.googleapis.com">'+
      '<link rel="stylesheet" id="fonts" href="'+esc(fonts)+'">'+
      '<style id="css">'+css+'</style></head><body>'+body.outerHTML+
      '\n<script type="application/json" id="state">\n'+json+'\n<\/script>\n'+
      '<script id="app">'+js+'<\/script></body></html>';
  }
  function schedule(){
    pending = true; setSave('Saving…');
    clearTimeout(timer);
    timer = setTimeout(save, 2000);
  }
  function save(){
    if (!pending) return;
    if (!api){ setSave('Not saved: saving is unavailable in this view', true); return; }
    pending = false;
    api.publish(buildDoc()).then(function(){ setSave('Saved'); }, function(err){
      var c = err && err.code;
      if (c === 'conflict'){ setSave('Someone else saved first; reloading their version'); return; }
      if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'not_declared'){
        readOnly = true; setSave(''); render(); return;
      }
      if (c === 'rate_limited'){ pending = true; setSave('Saving shortly…'); timer = setTimeout(save, 8000); return; }
      setSave('Couldn’t save. Tick again to retry.', true);
    });
  }
  document.addEventListener('change', function(e){
    var cb = e.target; if (!cb.matches || !cb.matches('input[type=checkbox][data-id]')) return;
    if (readOnly) return;
    S.phases.forEach(function(p){ p.items.forEach(function(it){
      if (it.id === cb.dataset.id){
        it.done = cb.checked;
        if (cb.checked) it.at = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}); else delete it.at;
      }
    }); });
    render();
    var again = document.getElementById('cb-'+cb.dataset.id); if (again) again.focus();
    schedule();
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.chip'); if (!b) return;
    if (b.dataset.r){ release = b.dataset.r; try { localStorage.setItem('g15-release', release); } catch(err){} }
    else { filter = b.dataset.f; try { localStorage.setItem('g15-filter', filter); } catch(err){} }
    render();
  });
  render();
  if (window.claude && window.claude.use){
    window.claude.use('artifact').then(function(a){
      api = a;
      if (!a){ setSave(''); }
      if (pending) save();
    }, function(){ api = null; });
  }
})();
</script></body></html>
