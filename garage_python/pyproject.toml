[project]
name = "garage_rag"
version = "1.5.0"
description = "Local-first personal RAG pipeline over Postgres + pgvector, with authorship attribution and an MCP server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rick Mark-Penwell" }]
requires-python = ">=3.13,<3.15"
keywords = ["rag", "mcp", "pgvector", "postgres", "embeddings", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    # storage
    "sqlalchemy>=2.0",
    "psycopg[pool]>=3.2",
    "pgvector>=0.5,<0.6",
    # document extraction (all permissive licenses; PyMuPDF avoided due to AGPL)
    "pypdf>=6.16",
    "pdfplumber>=0.11.10",
    # Not imported directly: pulled in transitively by pdfminer-six (pdfplumber).
    # The old <44 ceiling had no recorded reason and blocked the free-threaded
    # build: 43.x has no cp314t wheels and does not build from source there.
    "cryptography>=44",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    # OCR
    "pillow>=11.0",
    # fact extraction: the vendored LangExtract subset (garage_rag/enrich/langextract)
    # needs regex for its tokenizer.
    "regex>=2023.0.0",
    # the egress guard's HTTP client (garage_rag/net/egress.py), which every
    # outbound HTTP request goes through, garage_rag/inference's included
    "httpx>=0.28",
    # MCP server (2.x renamed FastMCP -> MCPServer; 1.x is incompatible)
    "mcp[cli]==2.1.0",
    # HTTP transport for garage-mcp (mcp_server/server.py imports it directly)
    "uvicorn>=0.30",
    # plumbing
    "typer>=0.15",
    "pydantic>=2.7.4",
    "rich>=13.9",
    "pyyaml>=6.0",
    # A runtime dep on purpose: the Bazel @pypi hub (--@pypi//dep_group=garage_rag)
    # only exposes packages reachable from [project.dependencies], so the py_test
    # targets can't resolve @pypi//pytest from an optional/dev group.
    "pytest>=9.1.1",
    # gRPC & Protobuf
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    # Not imported by garage_rag: the macOS app's embedded interpreter imports them at start-up so
    # ssl's default contexts verify against the system trust store (certifi is the fallback). The
    # bundled OpenSSL has no CA files of its own.
    "truststore>=0.10",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# Local tooling for the uv venv only; the Bazel @pypi hub does not expose this group.
dev = [
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "grpcio-tools>=1.68.0",
    # tools/swiftcheck: Swift syntax checking where no Swift toolchain exists (Linux, web sessions)
    "tree-sitter>=0.25",
    "tree-sitter-swift>=0.7",
    # garage_python/tests/fake_messages.py: the invented people and messages in the fake chat.db
    "faker>=37",
    # tests/test_git_history.py reads through pygit2 as a venv does (the `git` extra)
    "pygit2>=1.20",
]
# Git attribution outside the app, where the Python has no built-in _garage_git: pygit2 reads
# history in-process (garage_rag.attribute.git). Without it, git attribution is skipped.
git = ["pygit2>=1.20"]
# aspect_rules_py builds sdists into wheels with `build` and `setuptools`, resolved from uv.lock
# and from the hub's dependency group. grpcio ships no free-threaded (cp314t) wheels, so the 3.14t
# build compiles it from source. The Bazel group below pulls this extra in.
build-tools = ["build", "setuptools"]

[dependency-groups]
# The @pypi hub's group (`--@pypi//dep_group=garage_rag` in .bazelrc). Without a
# [dependency-groups] table the hub derives it from the project alone; declaring one replaces that,
# so it names the project itself, plus the sdist build tools.
garage_rag = ["garage_rag[build-tools]"]

[project.urls]
Homepage = "https://garagerag.app"
Source = "https://github.com/rickmark/garage-rag"
Issues = "https://github.com/rickmark/garage-rag/issues"

[project.scripts]
garage = "garage_rag.cli:main_cli"
garage-mcp = "garage_rag.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_rag"]
exclude = ["BUILD.bazel"]

# PyPI's sdist: the package and its build hook, without the tests (their corpora are most of the
# size) or the Bazel and uv files.
[tool.hatch.build.targets.sdist]
include = ["/src/garage_rag", "/hatch_build.py", "/README.md", "/LICENSE"]
exclude = ["BUILD.bazel"]

# hatch_build.py: copies ../data/sql and ../data/models/models.json into the package as
# garage_rag/_data, which a PyPI install reads in place of the repository's data/.
[tool.hatch.build.hooks.custom]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Vendored third-party code keeps its upstream style (see its __init__ docstring), and the test
# corpora are upstream copies too (ruff also formats the code blocks in their Markdown).
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "src/garage_rag/enrich/langextract", "tests/corpora"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["garage_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ty.src]
# Generated protobuf stubs are excluded from type checking, as they are from Ruff
# above. `exclude` lives under `src` for ty; a top-level `[tool.ty] exclude` is a
# hard config error that makes ty exit non-zero before it checks anything.
exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "src/garage_rag/enrich/langextract"]

[tool.ty.rules]
unresolved-import = "ignore"
