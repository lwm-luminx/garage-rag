name: macOS build

# `aspect test //...` on macOS: the app, its XPC services, and the vendored
# Postgres, ICU, Python.framework and llama.cpp built from source. It is by far
# the slowest check, so:
#
# - Pull requests run it only when the build could have changed. Python-only
#   edits are covered by ci.yaml's Linux `python` job. Run it by hand
#   (workflow_dispatch) when in doubt.
# - A push does not cancel a run in progress. The newest push waits for it, and
#   GitHub keeps only the latest waiting run, so a finished run always reports.
# - main runs it on every push, plus a nightly run on main. Its cache is
#   Aspect Cloud's remote cache, shared by every branch.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "macapp/**"
      - "ext/**"
      - "bazel/**"
      - "tools/**"
      - "proto/**"
      - "data/**"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".aspect/**"
      - "garage_python/pyproject.toml"
      - "garage_python/uv.lock"
      - ".github/workflows/macos.yaml"
      - ".github/actions/**"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  # The Aspect CLI's artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          # Caching is Aspect Cloud's remote cache, which setup-aspect wires in once the token
          # signs the CLI in: shared by every branch and job, and --config=ci uploads local
          # results as they finish, so a run stopped by the timeout keeps its work.
          #
          # Appended to ~/.bazelrc, read after the workspace's .bazelrc:
          # - Caching the site-packages and copied/signed tree artifacts ran Bazel out of file
          #   descriptors ("Too many open files"), even at 65536. Those actions only copy and
          #   sign files, so they stay out of the cache and re-run on each fresh runner.
          # - -XX:-MaxFDLimit: on macOS the JVM caps Bazel at 10240 descriptors otherwise.
          # - --build_tests_only: build what the tests need, not every non-manual target.
          # - --noapple_generate_dsym: tests never use dSYMs, and dsymutil is slow.
          bazelrc: |
            common --modify_execution_info=^(PythonSitePackages|CopyToDirectory|Codesign)$=+no-cache
            startup --host_jvm_args=-XX:-MaxFDLimit
            test --build_tests_only
            build --noapple_generate_dsym
      - run: |
          # Headroom for the rest: the runner's shell default is 256, and on macOS
          # the JVM caps Bazel at 10240 unless told not to (-MaxFDLimit in setup-aspect's bazelrc).
          ulimit -n 65536 2>/dev/null || ulimit -n "$(sysctl -n kern.maxfilesperproc)"
          echo "open file limit: $(ulimit -n)"
          aspect test --task:name test -- //...
        # Stop before the hosted runner's 6h job limit, so the job reports (and
        # the remote cache keeps what finished) instead of being killed.
        timeout-minutes: 320
