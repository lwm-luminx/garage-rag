name: macOS build

# `aspect test //...` on macOS: the app, its XPC services, and the vendored
# Postgres, ICU and llama.cpp built from source. It is by far the slowest
# check, so:
#
# - Pull requests run it only when the build could have changed. Rust-only
#   edits are covered by ci.yaml's Linux `rust` job. Run it by hand
#   (workflow_dispatch) when in doubt.
# - A push does not cancel a run in progress. The newest push waits for it, and
#   GitHub keeps only the latest waiting run, so a finished run always reports.
# - main and next run it on every push, plus a nightly run on main.
#
# Caching is Aspect Cloud's remote cache, which setup-aspect wires in once the
# ASPECT_API_TOKEN org secret signs the CLI in. It is shared by every branch and
# job, action by action, and --config=ci uploads local results as they finish,
# so a run stopped by the timeout below still leaves its work for the next one.
# A fork's pull request gets no secret and builds cold.
on:
  push:
    branches: [main, next]
  pull_request:
    paths:
      - "macapp/**"
      - "ext/**"
      - "bazel/**"
      - "tools/**"
      - "proto/**"
      - "rust/**"
      - "data/**"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".aspect/**"
      - ".github/workflows/macos.yaml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  # The Aspect CLI's artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "macOS: aspect test //..."
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          # Appended to ~/.bazelrc, which Bazel reads after the workspace's .bazelrc.
          #
          # - Caching the copied and signed tree artifacts (Postgres, the bundle's
          #   resources) ran Bazel out of file descriptors ("Too many open files"),
          #   even at 65536. Those actions only copy and sign files, so they stay out
          #   of the cache and re-run on each fresh runner.
          # - -XX:-MaxFDLimit: on macOS the JVM caps Bazel at 10240 descriptors
          #   unless told not to.
          # - --build_tests_only: build what the tests need, not every non-manual
          #   target in //....
          # - --noapple_generate_dsym: .bazelrc asks for dSYMs on every build, and
          #   dsymutil over llama.cpp and Postgres is slow; tests never use them.
          bazelrc: |
            common --modify_execution_info=^(CopyToDirectory|Codesign)$=+no-cache
            startup --host_jvm_args=-XX:-MaxFDLimit
            test --build_tests_only
            build --noapple_generate_dsym
      - name: aspect test //...
        env:
          # Only main and next write to the remote cache: a pull request reads what they built
          # and uploads nothing of its own (a cold upload from a PR ran past an hour, #326).
          REMOTE_UPLOAD: ${{ github.event_name == 'pull_request' && '--bazel-flag=--noremote_upload_local_results' || '' }}
        run: |
          # Headroom for the rest: the runner's shell default is 256.
          ulimit -n 65536 2>/dev/null || ulimit -n "$(sysctl -n kern.maxfilesperproc)"
          echo "open file limit: $(ulimit -n)"
          # shellcheck disable=SC2086 # empty, or one flag
          aspect test $REMOTE_UPLOAD --task:name test -- //...
        # Stop before the hosted runner's 6h job limit, so the job reports (and
        # the remote cache keeps what finished) instead of being killed.
        timeout-minutes: 330
