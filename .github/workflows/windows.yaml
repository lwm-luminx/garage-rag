name: Windows build

# Postgres (with pgvector, ICU and zlib) built from source on Windows, from the same
# pinned sources the macOS app bundles, and the Rust services and the app on it.
#
# The macOS build goes through Bazel (//ext/postgres and friends), and those rules
# are Darwin-only: the darwin configure template, dsymutil, install_name_tool.
# Windows uses each project's own MSVC build instead:
#
# - `postgres`: ICU (allinone.sln) and zlib (CMake), then Postgres with meson and
#   pgvector with Makefile.win. The smoke test initdbs an ICU cluster and applies
#   data/sql twice, as the service's tests do.
# - `rust`: the Rust libraries the services run (garage_service_ffi, garage_ingest_ffi,
#   garage_mcp_ffi, docs/plans/python-removal.md), built with Cargo for MSVC, with
#   libgit2 and SQLite from vcpkg linked statically; uploaded as `rust-windows-x64`.
# - `winapp`: the native Windows app (winapp/), built with the .NET SDK rather than
#   Bazel. Its service tests start Garage.Services.exe on those libraries, as the app
#   does.
# - `package`: the MSIX, the MSI and Garage-Setup.exe (winapp/packaging), staged
#   from the builds above, uploaded unsigned as `garage-windows-x64`. The Visual
#   C++ runtime comes from Microsoft's Redistributable, downloaded by the scripts.
#   Signing and the Store's identity are release steps (winapp/packaging/README.md).
#
# tools/windows/fetch_ext.py reads the url and sha256 out of ext/*/*.MODULE.bazel,
# so a version bump there moves this build too. The Postgres sandbox patches and
# the mmap postgresql.conf defaults are not applied: they exist for the macOS App
# Sandbox, and Windows has its own shared memory implementation.
on:
  push:
    branches: [main, next]
  pull_request:
    paths:
      - "ext/postgres/**"
      - "ext/pgvector/**"
      - "ext/libicu/**"
      - "ext/libzlib/**"
      - "data/sql/**"
      - "tools/windows/**"
      - "winapp/**"
      - "rust/**"
      - ".github/workflows/windows.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Paths
        run: |
          "SRC=$env:RUNNER_TEMP\src" >> $env:GITHUB_ENV
          "DEPS=$env:RUNNER_TEMP\deps" >> $env:GITHUB_ENV
          "PGROOT=$env:RUNNER_TEMP\pgsql" >> $env:GITHUB_ENV
      - name: Build tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade meson ninja pkgconf
          choco install winflexbison3 --no-progress -y
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch sources
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/windows/fetch_ext.py --dest $env:SRC postgres libicu libzlib pgvector

      - name: Restore ICU
        id: icu-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\icu
          key: icu-windows-x64-${{ hashFiles('ext/libicu/libicu.MODULE.bazel') }}
      - name: Build ICU
        if: steps.icu-cache.outputs.cache-hit != 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # ICU's projects name one toolset; build with whichever this Visual Studio has.
          $toolset = @{ '17.0' = 'v143'; '18.0' = 'v145' }[$env:VisualStudioVersion]
          $extra = @()
          if ($toolset) { $extra += "/p:PlatformToolset=$toolset" }
          msbuild "$env:SRC\libicu\source\allinone\allinone.sln" /m /v:minimal /nologo `
            /p:Configuration=Release /p:Platform=x64 /p:SkipUWP=true @extra
          $icu = "$env:RUNNER_TEMP\icu"
          New-Item -ItemType Directory -Force "$icu\bin", "$icu\lib", "$icu\include" | Out-Null
          Copy-Item "$env:SRC\libicu\bin64\icu*.dll" "$icu\bin"
          Copy-Item "$env:SRC\libicu\lib64\icu*.lib" "$icu\lib"
          Copy-Item -Recurse "$env:SRC\libicu\include\unicode" "$icu\include"
      - name: Build zlib
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S "$env:SRC\libzlib" -B "$env:SRC\zlib-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:DEPS" `
            -DZLIB_BUILD_TESTING=OFF -DZLIB_BUILD_STATIC=OFF -DZLIB_BUILD_MINIZIP=OFF
          cmake --build "$env:SRC\zlib-build"
          cmake --install "$env:SRC\zlib-build"
          Get-ChildItem -Recurse "$env:DEPS" | Select-Object -ExpandProperty FullName
      - name: pkg-config files for ICU and zlib
        # Neither ICU's MSBuild nor meson's MSVC zlib lookup gives meson something to
        # find, so describe both, and nothing else: PKG_CONFIG_LIBDIR replaces the
        # default search path, which keeps Strawberry Perl's MinGW .pc files out. The
        # variable is not called prefix: pkgconf on Windows redefines prefix as the .pc
        # file's grandparent directory.
        run: |
          $pc = "$env:DEPS\pkgconfig"
          New-Item -ItemType Directory -Force $pc | Out-Null
          $icu = "$env:RUNNER_TEMP\icu" -replace '\\', '/'
          $deps = "$env:DEPS" -replace '\\', '/'
          $zlib = Get-ChildItem "$env:DEPS\lib" -Filter *.lib | Select-Object -First 1
          if (-not $zlib) { throw "no zlib import library in $env:DEPS\lib" }
          @"
          root=$icu
          Name: icu-uc
          Description: ICU common
          Version: 76.1
          Libs: -L`${root}/lib -licuuc -licudt
          Cflags: -I`${root}/include
          "@ | Set-Content "$pc\icu-uc.pc"
          @"
          root=$icu
          Name: icu-i18n
          Description: ICU internationalization
          Version: 76.1
          Requires: icu-uc
          Libs: -L`${root}/lib -licuin
          Cflags: -I`${root}/include
          "@ | Set-Content "$pc\icu-i18n.pc"
          @"
          root=$deps
          Name: zlib
          Description: zlib
          Version: 1.3.2
          Libs: -L`${root}/lib -l$($zlib.BaseName)
          Cflags: -I`${root}/include
          "@ | Set-Content "$pc\zlib.pc"
          Get-ChildItem $pc | ForEach-Object { "== $($_.Name)"; Get-Content $_ }
          "PKG_CONFIG=pkgconf" >> $env:GITHUB_ENV
          "PKG_CONFIG_LIBDIR=$pc" >> $env:GITHUB_ENV

      - name: Build Postgres
        # The same feature set as the macOS configure: ICU and zlib, no OpenSSL.
        # Everything else is off rather than auto, so nothing the runner happens to
        # have installed (Strawberry Perl, OpenSSL, Python) sneaks in.
        env:
          CC: cl
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          meson setup "$env:SRC\pg-build" "$env:SRC\postgres" --prefix="$env:PGROOT" `
            --buildtype=release --auto-features=disabled -Dssl=none -Dicu=enabled -Dzlib=enabled
          meson compile -C "$env:SRC\pg-build"
          meson install -C "$env:SRC\pg-build" --quiet
          # Ship the ICU and zlib DLLs next to the binaries that load them.
          Copy-Item "$env:RUNNER_TEMP\icu\bin\*.dll", "$env:DEPS\bin\*.dll" "$env:PGROOT\bin"
      - name: Build pgvector
        working-directory: ${{ runner.temp }}\src\pgvector
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          nmake /NOLOGO /F Makefile.win
          nmake /NOLOGO /F Makefile.win install
      - name: Smoke test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = "$env:PGROOT\bin"
          $data = "$env:RUNNER_TEMP\pgdata"
          & "$bin\initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C `
            --locale-provider=icu --icu-locale=en-US
          & "$bin\pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP\postgres.log" -o "-p 5433" -w start
          try {
            $psql = @("-X", "-v", "ON_ERROR_STOP=1", "-h", "localhost", "-p", "5433", "-U", "postgres")
            & "$bin\psql.exe" @psql -d postgres -c "CREATE DATABASE garage_smoke"
            # Twice: the migrations are meant to be re-applied.
            foreach ($pass in 1, 2) {
              Get-ChildItem data\sql\*.sql | Sort-Object Name | ForEach-Object {
                & "$bin\psql.exe" @psql -q -d garage_smoke -f $_.FullName
              }
            }
            @"
          SELECT version();
          SELECT extname, extversion FROM pg_extension ORDER BY extname;
          SELECT datlocprovider, datlocale FROM pg_database WHERE datname = current_database();
          SELECT '[1,2,3]'::vector <-> '[3,2,1]'::vector AS l2,
                 binary_quantize('[1,-2,3]'::vector) AS bq,
                 similarity('garage', 'garages') AS trgm,
                 'a' < 'B' COLLATE "en-US-x-icu" AS icu_order;
          "@ | Set-Content "$env:RUNNER_TEMP\smoke.sql"
            & "$bin\psql.exe" @psql -d garage_smoke -f "$env:RUNNER_TEMP\smoke.sql"
          } finally {
            & "$bin\pg_ctl.exe" -D $data -m fast -w stop
            Get-Content "$env:RUNNER_TEMP\postgres.log"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-windows-x64
          path: ${{ runner.temp }}\pgsql
          if-no-files-found: error

  rust:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      # rustup reads rust/rust-toolchain.toml and installs that toolchain on first use.
      - name: libgit2 and SQLite (vcpkg, static, dynamic CRT as rustc links it)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # pcre2 without its default `jit` feature, whose sljit download asks api.github.com, which
          # refuses the runner's unauthenticated requests; libgit2 compiles its patterns, never JITs them.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install pcre2[core]:x64-windows-static-md libgit2[core,pcre2]:x64-windows-static-md sqlite3:x64-windows-static-md
      - name: Build the service libraries
        working-directory: rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # garage-git's build.rs: lib\git2.lib with zlib, pcre2-8 and http_parser; garage-ingest's sqlite3
          # binding: lib\sqlite3.lib. VCPKG_INSTALLATION_ROOT is the runner's own variable, which the
          # workflow's `env` context does not see, so the paths are made here.
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          Get-ChildItem "$vcpkg\lib"
          $env:GARAGE_LIBGIT2_DIR = $vcpkg
          $env:RUSTFLAGS = "-L native=$vcpkg\lib"
          # Without Tesseract until the app ships its own build (windows.md section 5.5): pictures read as no text.
          cargo build --release --no-default-features -p garage-service-ffi -p garage-ingest-ffi -p garage-mcp-ffi
          Get-ChildItem target\release\*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rust-windows-x64
          path: |
            rust/target/release/garage_service_ffi.dll
            rust/target/release/garage_ingest_ffi.dll
            rust/target/release/garage_mcp_ffi.dll
          if-no-files-found: error

  winapp:
    needs: [postgres, rust]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: winapp/global.json
      # PostgresSupervisor's tests run the app's own cluster from this build.
      - uses: actions/download-artifact@v4
        with:
          name: postgres-windows-x64
          path: ${{ runner.temp }}\pgsql
      # The service tests start Garage.Services.exe on these.
      - uses: actions/download-artifact@v4
        with:
          name: rust-windows-x64
          path: ${{ runner.temp }}\native
      - name: Build and test
        working-directory: winapp
        env:
          GARAGE_TEST_POSTGRES_HOME: ${{ runner.temp }}\pgsql
          GARAGE_TEST_NATIVE_DIR: ${{ runner.temp }}\native
          GARAGE_TEST_REQUIRE_NATIVE: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test --solution Garage.slnx -c Release
      # The FlaUI tests drive the built app against a fake backend (windows-ui.md §5). They need an
      # interactive desktop, which hosted runners do not promise, so a failure here is reported
      # without failing the job until they have proven steady (or move to a self-hosted runner).
      - name: UI tests
        working-directory: winapp
        continue-on-error: true
        env:
          GARAGE_UI_TESTS: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test --project tests/Garage.App.UITests/Garage.App.UITests.csproj -c Release --no-build

  package:
    needs: [postgres, rust]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: winapp/global.json
      - uses: actions/download-artifact@v4
        with:
          name: rust-windows-x64
          path: ${{ runner.temp }}\native
      - uses: actions/download-artifact@v4
        with:
          name: postgres-windows-x64
          path: ${{ runner.temp }}\pgsql
      - name: Stage
        run: winapp/packaging/stage.ps1 -NativeDir "$env:RUNNER_TEMP\native" -PostgresHome "$env:RUNNER_TEMP\pgsql"
      - name: MSIX
        run: winapp/packaging/msix.ps1
      - name: MSI
        run: winapp/packaging/msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: garage-windows-x64
          path: |
            winapp/packaging/out/*.msix
            winapp/packaging/out/*.msi
            winapp/packaging/out/Garage-Setup-*.exe
          if-no-files-found: error
