name: CI

# The fast checks every push gets, most of them on Linux:
#
# - `rust`: rustfmt, clippy and cargo test over rust/ (with a pgvector Postgres
#   service, so the tests that need a server run instead of passing without
#   running), the protogen and cbindgen output checks, the third-party notices
#   check, the UniFFI Python round trip and the .NET binding's tests.
# - `swiftcheck`: the tree-sitter Swift syntax gate (tools/swiftcheck).
# - `winapp-bazel`: `aspect test //winapp/...`, the Windows app's projects but the
#   WinUI app, built and tested through rules_dotnet on Linux.
# - `aspect`: the Aspect CLI tasks (buildifier, format, gazelle, lint) in one
#   Linux job. Each still reports its own `aspect / <task>` check through the
#   Aspect GitHub App, which is what the branch ruleset requires. Lint covers the
#   Python dev tools that are Bazel targets, which need no Mac.
#
# Every `aspect` job signs in to Aspect Cloud with the ASPECT_API_TOKEN org secret
# (aspect-build/setup-aspect), which wires Aspect's remote cache and BES into the
# build and turns on the CLI's GitHub check runs, PR summary comment and lint
# review comments. A fork's pull request gets no secret and builds without them.
#
# The Bazel build and test of //... on macOS (the app, Postgres, ICU and
# llama.cpp from source) is macos.yaml; the Windows app is windows.yaml.
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  # The Aspect CLI's artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: fmt, clippy and tests (rust/)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # garage-service's and garage-cli's tests create and drop their own garage_test_*
      # databases; a superuser, since pgvector is not a trusted extension.
      GARAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: winapp/global.json
      # Cargo's registry and rust/target, keyed on the toolchain and Cargo.lock. Pushes to main
      # save; pull requests restore it and save nothing, so they do not evict main's entries
      # from the 10 GB quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install protoc, libgit2, SQLite and Tesseract
        # garage-git links libgit2, found through pkg-config; garage-ingest links the system SQLite;
        # garage-ocr links libtesseract, and its tests read with the English data.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libgit2-dev libsqlite3-dev libtesseract-dev tesseract-ocr-eng pkg-config
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --features garage-plugin/grpc -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace --features garage-plugin/grpc
      - name: The checked-in generated code matches proto/
        run: |
          cargo run --locked -p protogen
          git diff --exit-code -- garage-plugin/src/generated garage-facade/src/generated
      - name: The checked-in C headers match the Rust (cbindgen)
        run: cargo run --locked -p headergen -- --check
      - name: The third-party notices cover Cargo.lock and the bundled components
        working-directory: .
        run: python3 tools/third_party_notices.py --check
      - name: UniFFI's Python bindings call the embed worker and back
        run: |
          cargo build --locked -p garage-embed-uniffi -p uniffi-bindgen
          target/debug/uniffi-bindgen generate --library target/debug/libgarage_embed_uniffi.so \
            --language python --no-format --out-dir "$RUNNER_TEMP/uniffi"
          cp target/debug/libgarage_embed_uniffi.so "$RUNNER_TEMP/uniffi/"
          python3 garage-embed-uniffi/tests/python_roundtrip.py "$RUNNER_TEMP/uniffi"
      - name: Build the C ABI library
        run: cargo build --release --locked -p garage-text-ffi
      - name: .NET binding tests against the built library
        # From winapp/, so global.json selects the SDK and Microsoft.Testing.Platform.
        working-directory: winapp
        run: dotnet test --project tests/Garage.Plugins.Tests/Garage.Plugins.Tests.csproj
        env:
          GARAGE_TEXT_FFI_LIBRARY: ${{ github.workspace }}/rust/target/release/libgarage_text_ffi.so

  swiftcheck:
    name: "Swift: syntax check (tree-sitter)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Swift syntax gate (tree-sitter)
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" tree-sitter tree-sitter-swift
          "$RUNNER_TEMP/venv/bin/python" tools/swiftcheck/swift_syntax_check.py

  # The Bazel build of winapp/ (winapp/README.md, "Bazel"): every project but the WinUI app and
  # its FlaUI tests, compiled and tested on Linux, plus the check that each BUILD.bazel still
  # mirrors its csproj. .aspect/config.axl adds --config=linux after --config=ci on Linux, so
  # the build targets the host rather than ci's macOS platform.
  winapp-bazel:
    name: "Windows app: Bazel build and tests (winapp/, Linux)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: aspect test //winapp/...
        run: aspect test --task:name winapp -- //winapp/...

  # One runner for all four tasks: they share the CLI download, the Bazel server and its
  # caches. Every task runs even when an earlier one fails, so each check reports.
  aspect:
    name: "Aspect: buildifier, format, gazelle, lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: aspect buildifier
        run: aspect buildifier --task:name buildifier
      - name: aspect format
        if: ${{ !cancelled() }}
        run: aspect format --task:name format
      - name: aspect gazelle
        if: ${{ !cancelled() }}
        run: aspect gazelle --task:name gazelle
      # Ruff over the Python tools that are Bazel targets (tools/lint/linters.bzl). Not //...:
      # the app's targets are macOS-only and do not analyze on Linux.
      - name: aspect lint
        if: ${{ !cancelled() }}
        run: aspect lint --task:name lint -- //tools:third_party_notices //winapp/bazel/...
