name: CI

# The fast checks every push gets, most of them on Linux:
#
# - `rust`: rustfmt, clippy and cargo test over rust/ (with a pgvector Postgres
#   service, so the tests that need a server run instead of passing without
#   running), the protogen and cbindgen output checks and the third-party notices
#   check. `rust-bindings`, beside it: the UniFFI Python round trip and the .NET
#   binding's tests against the built library. Both keep rust/target in a cache
#   that main and next save.
# - `swiftcheck`: the tree-sitter Swift syntax gate (tools/swiftcheck).
# - `format`, `gazelle`, `buildifier`: the Aspect CLI tasks, which need no Mac.
# - `lint`: stays on macOS, because it analyzes //..., Apple targets included.
#
# The Bazel build and test of //... (the app, Postgres, ICU and llama.cpp from
# source) is in macos.yaml. It runs only when the build could have changed, and
# a newer push does not cancel it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: fmt, clippy and tests (rust/)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # garage-service's tests (rust/garage-service/tests) create and drop their own
      # garage_test_* databases, as test_postgres.py does; a superuser, since pgvector is not
      # a trusted extension.
      GARAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      # rust/target and Cargo's registry. Only main and next save it, as for the Bazel caches,
      # so pull requests read their base branch's without spending the 10 GB quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust-tests
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      - name: Install protoc, libgit2 and SQLite
        # garage-git links libgit2, found through pkg-config; garage-ingest links the system SQLite;
        # garage-ocr links libtesseract, and its tests read with the English data.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libgit2-dev libsqlite3-dev libtesseract-dev tesseract-ocr-eng pkg-config
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --features garage-plugin/grpc -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace --features garage-plugin/grpc
      - name: The checked-in generated code matches proto/
        run: |
          cargo run --locked -p protogen
          git diff --exit-code -- garage-plugin/src/generated garage-facade/src/generated
      - name: The checked-in C headers match the Rust (cbindgen)
        run: cargo run --locked -p headergen -- --check
      - name: The third-party notices cover Cargo.lock and the bundled components
        working-directory: .
        run: python3 tools/third_party_notices.py --check

  # The bindings, beside the rust job rather than after it: they need no Postgres and build
  # their own crates, so the two run at once and the slower one sets the wall-clock time.
  rust-bindings:
    name: "Rust: UniFFI and .NET bindings"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust-bindings
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: winapp/global.json
      - name: Install protoc, libgit2 and SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libgit2-dev libsqlite3-dev pkg-config
      - name: UniFFI's Python bindings call the embed worker and back
        run: |
          cargo build --locked -p garage-embed-uniffi -p uniffi-bindgen
          target/debug/uniffi-bindgen generate --library target/debug/libgarage_embed_uniffi.so \
            --language python --no-format --out-dir "$RUNNER_TEMP/uniffi"
          cp target/debug/libgarage_embed_uniffi.so "$RUNNER_TEMP/uniffi/"
          python3 garage-embed-uniffi/tests/python_roundtrip.py "$RUNNER_TEMP/uniffi"
      - name: Build the C ABI library
        run: cargo build --release --locked -p garage-text-ffi
      - name: .NET binding tests against the built library
        # From winapp/, so global.json selects the SDK and Microsoft.Testing.Platform.
        working-directory: winapp
        run: dotnet test --project tests/Garage.Plugins.Tests/Garage.Plugins.Tests.csproj
        env:
          GARAGE_TEXT_FFI_LIBRARY: ${{ github.workspace }}/rust/target/release/libgarage_text_ffi.so

  swiftcheck:
    name: "Swift: syntax check (tree-sitter)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Swift syntax gate (tree-sitter)
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" tree-sitter tree-sitter-swift
          "$RUNNER_TEMP/venv/bin/python" tools/swiftcheck/swift_syntax_check.py

  format:
    name: "Format: Python tools and Starlark formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: aspect format
        run: aspect format --task:name format

  gazelle:
    name: "Gazelle: BUILD files match the proto sources"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: aspect gazelle
        run: aspect gazelle --task:name gazelle

  # The Bazel build of winapp/ (winapp/README.md, "Bazel"): every project but the WinUI app and
  # its FlaUI tests, compiled and tested on Linux, plus the check that each BUILD.bazel still
  # mirrors its csproj. Plain `bazel`, not `aspect`: Aspect adds --config=ci on CI, whose macOS
  # platform has no Linux execution platform, where .bazelrc's build:linux targets the host.
  winapp-bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-winapp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-winapp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-
      - name: bazel test //winapp/...
        run: >-
          bazel test //winapp/... --test_output=errors
          --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
      # Pushes to main save; pull requests restore main's entry and save nothing, because
      # their entries are readable only by themselves and count against the repository's
      # 10 GB cache quota, where they evict macos.yaml's (see its "Caches" comment).
      - name: Save Bazel caches
        if: always() && github.event_name != 'pull_request' && steps.bazel-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  buildifier:
    name: "Buildifier: Starlark files"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: aspect buildifier
        run: aspect buildifier --task:name buildifier

  lint:
    name: "Lint: Ruff over //..., Apple targets included (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      # //tools:bazel_env has no sources to lint, and analyzing it fetches cosmopolitan binaries
      # (bazel_env.bzl -> rules_coreutils -> ape) from hosts outside our control.
      - name: aspect lint //...
        run: aspect lint --task:name lint -- //... -//tools:bazel_env
