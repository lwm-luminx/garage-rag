name: Set up the Aspect CLI
description: >-
  Installs the Aspect CLI launcher pinned by tools/tools.lock.json for this
  runner's OS and CPU (the CLI version it runs is pinned by .aspect/version.axl),
  and Bazelisk where the image lacks it. Given an Aspect API token, it also
  signs the CLI in to Aspect, which turns on its GitHub features: a check run
  per task, a PR summary comment, and lint findings as review comments (all
  through Aspect's GitHub App on the organization).
inputs:
  aspect-api-token:
    description: >-
      An Aspect API token (client_id:secret), usually secrets.ASPECT_API_TOKEN.
      Empty (a fork's pull request, or no secret) leaves the CLI signed out and
      the build unchanged.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        case "$RUNNER_OS" in
          macOS) os=macos ;;
          Linux) os=linux ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          ARM64) cpu=arm64 ;;
          X64) cpu=x86_64 ;;
          *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        url=$(jq -r --arg os "$os" --arg cpu "$cpu" '.aspect.binaries[] | select(.os==$os and .cpu==$cpu) | .url' tools/tools.lock.json)
        sha=$(jq -r --arg os "$os" --arg cpu "$cpu" '.aspect.binaries[] | select(.os==$os and .cpu==$cpu) | .sha256' tools/tools.lock.json)
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
        if command -v sha256sum >/dev/null; then
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | sha256sum -c -
        else
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
        fi
        chmod +x "$RUNNER_TEMP/bin/aspect"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        if ! command -v bazelisk >/dev/null && ! command -v bazel >/dev/null; then
          if [ "$os" = macos ]; then brew install bazelisk; else
            echo "no bazelisk or bazel on this image" >&2; exit 1
          fi
        fi
    # Sign in the way aspect-build/setup-aspect does: the token goes to the CLI on stdin, so it never
    # lands in GITHUB_ENV or another step's environment, and the CLI keeps a short-lived credential.
    # A failed sign-in only costs the GitHub features, never the build. Whitespace pasted into the secret
    # (a trailing newline) is dropped: the token is client_id:secret, which holds none.
    - if: inputs.aspect-api-token != ''
      shell: bash
      env:
        ASPECT_API_TOKEN: ${{ inputs.aspect-api-token }}
      run: |
        if printf '%s' "$ASPECT_API_TOKEN" | tr -d '[:space:]' | "$RUNNER_TEMP/bin/aspect" auth login --with-api-token; then
          "$RUNNER_TEMP/bin/aspect" auth status || true
        else
          echo "::warning::Aspect sign-in failed; tasks run without GitHub check runs or lint comments"
        fi
