syntax = "proto3";

package garage;

// The GarageService is how the macOS app drives the Python pipeline: corpus
// reads for its views, every operation it would otherwise shell out to the
// `garage` CLI for (sources, models, backfill, fact distillation, schema,
// settings, MCP client registration), and the database facade the ingest and
// embed XPC workers persist through. Each RPC is a thin wrapper over the same
// garage_rag.ops function the CLI command calls.
service GarageService {
    // Ping / Healthcheck
    rpc Ping (PingRequest) returns (PingResponse);

    // Inspect server state
    rpc GetStatus (StatusRequest) returns (StatusResponse);

    // Version info
    rpc GetVersion (VersionRequest) returns (VersionResponse);

    // --- Search ---
    rpc Search (SearchRequest) returns (SearchResponse);

    // --- Documents & Chunks ---
    rpc ListDocuments (ListDocumentsRequest) returns (ListDocumentsResponse);
    rpc GetDocument (GetDocumentRequest) returns (GetDocumentResponse);

    // --- Facts ---
    rpc ListFacts (ListFactsRequest) returns (ListFactsResponse);
    rpc GetFactStats (FactStatsRequest) returns (FactStatsResponse);

    // --- Sources ---
    rpc ListSources (ListSourcesRequest) returns (ListSourcesResponse);
    rpc AddSource (AddSourceRequest) returns (AddSourceResponse);
    rpc RemoveSource (RemoveSourceRequest) returns (RemoveSourceResponse);
    rpc Scan (ScanRequest) returns (stream ScanStatus);
    rpc SyncSources (SyncSourcesRequest) returns (SyncSourcesResponse);
    rpc ImportSourcesToConfig (ImportSourcesToConfigRequest) returns (ImportSourcesToConfigResponse);
    rpc Reconcile (ReconcileRequest) returns (ReconcileResponse);

    // --- Embedding Models ---
    rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
    rpc RegisterModel (RegisterModelRequest) returns (RegisterModelResponse);
    rpc SetDefaultModel (SetDefaultModelRequest) returns (SetDefaultModelResponse);
    rpc DropModel (DropModelRequest) returns (DropModelResponse);
    rpc Backfill (BackfillRequest) returns (stream BackfillStatus);
    // Has LlamaXPCService load a llama_xpc model (over NSXPC) unless it is already resident. For
    // processes outside the app's XPC services (the stdio launchers), which cannot reach it themselves.
    rpc EnsureLlamaModel (EnsureLlamaModelRequest) returns (EnsureLlamaModelResponse);

    // --- Facts ---
    rpc EnrichFacts (EnrichFactsRequest) returns (stream EnrichFactsStatus);
    rpc ClusterFacts (ClusterFactsRequest) returns (stream ClusterFactsStatus);
    rpc ListFactPrompts (ListFactPromptsRequest) returns (ListFactPromptsResponse);

    // --- Graph (Apache AGE; every reply says `available` where the server has none) ---
    // The graph's vertex and edge labels, with counts: the Graph page's filters.
    rpc GetGraphLabels (GraphLabelsRequest) returns (GraphLabelsResponse);
    // Vertices by title text or relational id, to pick where a walk starts.
    rpc FindGraphVertices (FindGraphVerticesRequest) returns (FindGraphVerticesResponse);
    // Everything within a few hops of one vertex, under label filters.
    rpc GetGraphNeighborhood (GraphNeighborhoodRequest) returns (GraphNeighborhoodResponse);

    // --- Schema, Stats & Settings ---
    rpc GetStats (StatsRequest) returns (StatsResponse);
    rpc InitDb (InitDbRequest) returns (InitDbResponse);
    rpc GetSetting (GetSettingRequest) returns (GetSettingResponse);
    rpc SetSetting (SetSettingRequest) returns (SetSettingResponse);

    // --- MCP Client Registration ---
    rpc McpInstall (McpInstallRequest) returns (McpInstallResponse);
    rpc McpUninstall (McpUninstallRequest) returns (McpUninstallResponse);
    rpc McpStatus (McpStatusRequest) returns (McpStatusResponse);

    // --- Database Facade for Ingest & Embed Workers ---
    rpc BeginIngestSession (BeginIngestSessionRequest) returns (BeginIngestSessionResponse);
    rpc PersistScan (PersistScanRequest) returns (PersistScanResponse);
    rpc CheckDocumentStat (CheckDocumentStatRequest) returns (CheckDocumentStatResponse);
    rpc PersistDocument (PersistDocumentRequest) returns (PersistDocumentResponse);
    rpc FinalizeIngestSession (FinalizeIngestSessionRequest) returns (FinalizeIngestSessionResponse);
    rpc GetEmbeddingBatches (GetEmbeddingBatchesRequest) returns (GetEmbeddingBatchesResponse);
    rpc UpdateEmbeddings (UpdateEmbeddingsRequest) returns (UpdateEmbeddingsResponse);
}

// ---------------------------------------------------------------------------
// Base / Generic / System Messages
// ---------------------------------------------------------------------------

message PingRequest {
    string message = 1;
}

message PingResponse {
    string message = 1;
    int64 timestamp = 2;
}

message StatusRequest {}

message StatusResponse {
    string version = 1;
    bool is_ready = 2;
    int32 pid = 3;
    string db_status = 4;
    string server_type = 5;
}

message VersionRequest {}

message VersionResponse {
    string version = 1;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

message SearchRequest {
    string query = 1;
    int32 limit = 2;
    string mode = 3; // hybrid | vector | fts
    string model = 4;
    repeated string corpus_classes = 5;
    repeated string trust_tiers = 6;
    repeated string sources = 7;
    string author = 8;
    bool full = 9;
    // "sent" | "received": only message chunks that went that way. Empty: no filter.
    string direction = 10;
}

message SearchHit {
    int32 rank = 1;
    string title = 2;
    string uri = 3;
    string corpus_class = 4;
    string trust_tier = 5;
    string matched_by = 6;
    float score = 7;
    string heading_path = 8;
    repeated string authors = 9;
    string text = 10;
    string snippet = 11;
    // Message chunks: "sent" | "received", and the handle that wrote it, or "me".
    // Empty for every other chunk.
    string direction = 12;
    string sender = 13;
}

message SearchResponse {
    repeated SearchHit hits = 1;
    int32 total_hits = 2;
    string formatted_output = 3;
}

// ---------------------------------------------------------------------------
// Documents & Chunks
// ---------------------------------------------------------------------------

message DocumentSummary {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    int32 chunk_count = 10;
    string state = 11;
    string ingested_at = 12;
    int32 fact_count = 13;
}

message ListDocumentsRequest {
    string source = 1; // source slug filter; empty = all sources
    string corpus_class = 2; // filter; empty = all
    string trust_tier = 3; // filter; empty = all
    string query = 4; // substring match on title/uri
    int32 limit = 5;
    int32 offset = 6;
}

message ListDocumentsResponse {
    repeated DocumentSummary documents = 1;
    int64 total_count = 2;
    string formatted_output = 3;
}

message DocumentChunkInfo {
    int64 id = 1;
    int32 ord = 2;
    string text = 3;
    int32 token_count = 4;
    // Span of documents.content; unset when the chunk is not a verbatim slice of it.
    optional int32 char_start = 5;
    optional int32 char_end = 6;
    string heading_path = 7;
}

message DocumentAuthorInfo {
    string name = 1;
    string role = 2;
    float confidence = 3;
}

message DocumentFactInfo {
    int64 id = 1;
    int32 ord = 2;
    string fact = 3;
    string fact_class = 4;
    string attributes_json = 5;
    // Span of documents.content the fact was grounded to.
    optional int32 char_start = 6;
    optional int32 char_end = 7;
    string extractor = 8;
}

message DocumentDetail {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    string extractor = 10;
    string extractor_version = 11;
    string chunker = 12;
    string meta_json = 13;
    string state = 14;
    string error = 15;
    string ingested_at = 16;
    repeated DocumentAuthorInfo authors = 17;
}

message GetDocumentRequest {
    int64 document_id = 1;
}

message GetDocumentResponse {
    DocumentDetail document = 1;
    repeated DocumentChunkInfo chunks = 2;
    string formatted_output = 3;
    repeated DocumentFactInfo facts = 4;
}

// ---------------------------------------------------------------------------
// Facts
// ---------------------------------------------------------------------------

message FactSummary {
    int64 id = 1;
    int64 document_id = 2;
    int32 ord = 3;
    string fact = 4;
    string fact_class = 5;
    string attributes_json = 6;
    // Span of documents.content the fact was grounded to.
    optional int32 char_start = 7;
    optional int32 char_end = 8;
    string extractor = 9;
    string extractor_model = 10;
    string created_at = 11;
    string document_title = 12;
    string document_uri = 13;
    string source_slug = 14;
    string corpus_class = 15;
    // The grounded span with some of the document either side; empty when the
    // fact has no span or the document keeps no content.
    string excerpt = 16;
    // Where the excerpt starts in documents.content, to place the span in it.
    int32 excerpt_start = 17;
    // The distilled fact this potential fact backs (garage cluster-facts); 0
    // when none yet. distilled_size counts the potential facts behind it, and
    // distilled_generated says the local model wrote its statement (so it is
    // not a quotation).
    int64 distilled_fact_id = 18;
    int32 distilled_size = 19;
    string distilled_statement = 20;
    bool distilled_generated = 21;
    // How varied the distilled fact's group is: the mean cosine distance of its
    // members to their centroid (0 for a fact standing alone).
    double distilled_spread = 22;
    // The fact of the same document this one restates; 0 when it restates none.
    int64 restates_fact_id = 23;
}

message FactClassCount {
    string fact_class = 1;
    int64 count = 2;
}

message ListFactsRequest {
    string query = 1; // full-text or substring match on the fact; empty = all
    string source = 2; // source slug filter; empty = all sources
    string fact_class = 3; // filter; empty = all
    string corpus_class = 4; // filter; empty = all
    int64 document_id = 5; // one document's facts; 0 = all
    int32 limit = 6;
    int32 offset = 7;
    bool collapse = 8; // list the potential facts behind one distilled fact once
    int64 distilled_fact_id = 9; // only the potential facts behind this distilled fact; 0 = all
}

message ListFactsResponse {
    repeated FactSummary facts = 1;
    int64 total_count = 2;
    // Fact classes under every filter but fact_class, most common first.
    repeated FactClassCount classes = 3;
    string formatted_output = 4;
}

// Fact counts under the same filters as ListFactsRequest.
message FactStatsRequest {
    string query = 1; // full-text or substring match on the fact; empty = all
    string source = 2; // source slug filter; empty = all sources
    string fact_class = 3; // filter; empty = all
    string corpus_class = 4; // filter; empty = all
    int64 document_id = 5; // one document's facts; 0 = all
}

message FactStatsResponse {
    int64 facts = 1;
    int64 documents = 2; // documents with at least one matching fact
    map<string, int64> facts_by_source = 3;
    map<string, int64> facts_by_class = 4;
    string formatted_output = 5;
    int64 distilled = 6;        // distilled facts behind the matching potential facts
    int64 clusters = 7;         // of those, the ones behind more than one
    int64 clustered_facts = 8;  // and how many potential facts they group
}

// ---------------------------------------------------------------------------
// Graph
// ---------------------------------------------------------------------------

// One vertex of the `garage` graph (garage_rag.db.graph).
message GraphVertex {
    int64 id = 1;              // the graph id, unique across labels; what edges refer to
    string label = 2;          // Document, Chunk, Author, PotentialFact, Fact, ...
    int64 key = 3;             // the relational id (documents.id, facts.id, ...); 0 for a label without one
    string title = 4;          // what to call it on screen: the title, name, fact or statement
    string properties_json = 5; // every property, as a JSON object
}

// One edge between two vertices' graph ids.
message GraphEdge {
    int64 id = 1;
    string label = 2;          // HAS_CHUNK, WROTE, RECEIVED, STATES, SUPPORTS, ...
    int64 source_id = 3;
    int64 target_id = 4;
    string properties_json = 5;
}

message GraphLabelCount {
    string label = 1;
    int64 count = 2;
}

message GraphLabelsRequest {}

message GraphLabelsResponse {
    bool available = 1;        // false where the server has no AGE or the graph is not built yet
    repeated GraphLabelCount vertex_labels = 2;
    repeated GraphLabelCount edge_labels = 3;
}

message FindGraphVerticesRequest {
    string query = 1;          // matched case-insensitively against titles, and as a relational id when numeric; empty = the first vertices
    string label = 2;          // one label; empty = every label with a title
    int32 limit = 3;           // default 50
}

message FindGraphVerticesResponse {
    bool available = 1;
    repeated GraphVertex vertices = 2;
}

message GraphNeighborhoodRequest {
    // The center, by graph id, or else by label and relational id (Document + documents.id, PotentialFact + facts.id, ...).
    int64 vertex_id = 1;
    string label = 2;
    int64 key = 3;
    int32 depth = 4;                    // hops out from the center; default 1, at most 6
    repeated string vertex_labels = 5;  // keep only these labels; empty = all (see all_vertex_labels)
    repeated string edge_labels = 6;    // keep only these labels; empty = all (see all_edge_labels)
    // Since an empty list means no filter, these say an empty list was meant literally.
    bool filter_vertex_labels = 7;
    bool filter_edge_labels = 8;
    int32 limit = 9;                    // stop at this many vertices; default 200
}

message GraphNeighborhoodResponse {
    bool available = 1;
    GraphVertex center = 2;
    repeated GraphVertex vertices = 3;  // the center included
    repeated GraphEdge edges = 4;       // both ends are in vertices
    bool truncated = 5;                 // the limit cut the walk short
}

// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------

message SourceInfo {
    string slug = 1;
    string kind = 2;
    string corpus_class = 3;
    string trust_tier = 4;
    // The cloud OCR fallback and its per-source switch were removed.
    reserved 5;
    reserved "allow_cloud_enrichment";
    bool enabled = 6;
    string root = 7;
    int64 document_count = 8;
    int64 expected_elements = 9;
}

message ListSourcesRequest {}

message ListSourcesResponse {
    repeated SourceInfo sources = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Embedding Models
// ---------------------------------------------------------------------------

message ModelInfo {
    string slug = 1;
    string provider = 2;
    string model_ref = 3;
    int32 dims = 4;
    int32 stored_dims = 5;
    string storage_kind = 6;
    string index_kind = 7;
    string table_name = 8;
    bool is_default = 9;
    string model_id = 10;
    string distance = 11;  // cosine | l2 | inner_product
    string modality = 12;  // text | image: what the model embeds
}

message ListModelsRequest {}

message ListModelsResponse {
    repeated ModelInfo models = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Stats
// ---------------------------------------------------------------------------

message StatsRequest {}

message StatsResponse {
    int64 documents = 1;
    int64 chunks = 2;
    int64 sources = 3;
    int64 models = 4;
    map<string, int64> chunks_by_model = 5;
    map<string, int64> documents_by_source = 6;
    string formatted_output = 7;
}

// ---------------------------------------------------------------------------
// Source Operations
// ---------------------------------------------------------------------------

message AddSourceRequest {
    string slug = 1;
    string root = 2;
    string kind = 3;          // default "filesystem"
    string corpus_class = 4;  // default "document"
    string trust = 5;         // default "authored"
    // The cloud OCR fallback and its per-source switch were removed.
    reserved 6;
    reserved "allow_cloud_enrichment";
}

message AddSourceResponse {
    string slug = 1;
    string root = 2;
    bool created = 3;
    string message = 4;
}

message RemoveSourceRequest {
    string slug = 1;
}

message RemoveSourceResponse {
    string slug = 1;
    int64 deleted_documents = 2;
    string message = 3;
}

message ScanRequest {
    string source = 1;  // slug, or "*"/empty for every enabled source
    bool include_code = 2;
}

message SourceScanStatus {
    string source = 1;
    string kind = 2;
    string root = 3;
    int64 item_count = 4;
    string item_type = 5;
    double duration_seconds = 6;
    string error = 7;
}

message ScanResponse {
    repeated SourceScanStatus sources = 1;
    int64 total_items = 2;
    string message = 3;
}

// One step of a scan: phase is progress (a running count while a source is walked) |
// source (one source finished; result) | finished (summary, the last message).
message ScanStatus {
    string phase = 1;
    string source = 2;
    int64 source_items = 3;       // found so far in `source`
    int64 total_items = 4;        // found so far across every source in this scan
    SourceScanStatus result = 5;  // phase = source
    ScanResponse summary = 6;     // phase = finished
}

message SyncSourcesRequest {
    bool dry_run = 1;
}

message UndeclaredSource {
    string slug = 1;
    int64 document_count = 2;
}

message SyncSourcesResponse {
    string config_path = 1;
    int32 declared = 2;
    bool applied = 3;
    repeated string created = 4;
    repeated string updated = 5;
    repeated UndeclaredSource undeclared = 6;
    string message = 7;
}

message ImportSourcesToConfigRequest {
    string path = 1;  // config file to update; empty = the one in use
}

message ImportSourcesToConfigResponse {
    string path = 1;
    repeated string added = 2;
    string message = 3;
}

message ReconcileRequest {
    string source = 1;
    bool apply = 2;
    bool force = 3;
}

message ReconcileResponse {
    string source = 1;
    int64 total_documents = 2;
    int64 candidates = 3;
    int64 deleted = 4;
    double fraction = 5;
    bool refused = 6;
    string reason = 7;
    string message = 8;
}

// ---------------------------------------------------------------------------
// Model Operations
// ---------------------------------------------------------------------------

message RegisterModelRequest {
    string slug = 1;
    int32 dims = 2;          // 0 = from the known-model table
    string model_ref = 3;
    string provider = 4;
    string model_id = 5;
    bool make_default = 6;
    string distance = 7;     // empty = models.json (cosine for models it does not list)
    string modality = 8;     // text | image; empty = models.json (text for models it does not list)
}

message RegisterModelResponse {
    ModelInfo model = 1;
    repeated string notes = 2;
    string message = 3;
}

message SetDefaultModelRequest {
    string slug = 1;
}

message SetDefaultModelResponse {
    string message = 1;
}

message DropModelRequest {
    string slug = 1;
}

message DropModelResponse {
    string message = 1;
}

message BackfillRequest {
    string model = 1;  // slug, or "*"/empty for every model
    int32 batch_size = 2;
    int32 limit = 3;
    bool skip_verify = 4;
}

// One step: phase is complete | skipped | started | progress | finished.
message BackfillStatus {
    string model_slug = 1;
    string phase = 2;
    int64 total = 3;
    int64 embedded = 4;
    int64 failed = 5;
    int64 remaining = 6;
    int64 batches = 7;
    string message = 8;
}

message EnsureLlamaModelRequest {
    string model = 1;  // the model's slug: the alias LlamaXPCService keeps it under
}

message EnsureLlamaModelResponse {
    string message = 1;
}

// ---------------------------------------------------------------------------
// Fact Distillation
// ---------------------------------------------------------------------------

message EnrichFactsRequest {
    string source = 1;       // slug, or "*"/empty for all sources
    int64 document_id = 2;   // > 0: just this document, ignoring source
    string model = 3;        // empty = facts.model
    string provider = 4;     // empty = facts.provider
    repeated string prompts = 5;  // empty = every enabled prompt that applies; else exactly these
    bool stale_only = 6;     // skip a prompt whose last run had the same prompt text, content and model
}

// phase is started (total, model, provider) | document (one per document) |
// finished (the totals).
message EnrichFactsStatus {
    string phase = 1;
    int64 total = 2;
    int64 index = 3;
    int64 document_id = 4;
    string document_uri = 5;
    int64 facts = 6;
    string error = 7;
    string model = 8;
    string provider = 9;
    int64 enriched = 10;
    int64 failed = 11;
    string message = 12;
    int64 skipped = 13;            // finished: documents no prompt ran on; document: 1 when skipped
    repeated string prompts = 14;  // document: the prompts that ran on it; finished: the prompts selected
}

// garage cluster-facts: link every potential fact to a distilled fact.
message ClusterFactsRequest {
    string model = 1;       // embedding model whose vectors are compared; empty = the default model
    double threshold = 2;   // cosine similarity a pair must reach; 0 = facts.cluster_threshold
    int32 neighbors = 3;    // nearest neighbours per fact; 0 = facts.cluster_neighbors
    bool no_distill = 4;    // do not ask the local chat model; groups are stated by a member's text
    bool no_graph = 5;      // do not rebuild the AGE graph afterwards
    bool full = 6;          // regroup the corpus, not only what is new (a changed model or setting does too)
}

// phase is documents | neighbors | grow | attach | distill (progress) | finished (the totals).
message ClusterFactsStatus {
    string phase = 1;
    int64 facts = 2;            // potential facts
    int64 unembedded = 3;       // potential facts with no vector under the model yet
    int64 scanned = 4;          // neighbors: facts whose neighbours were fetched
    int64 to_distill = 5;       // distill: new groups to put to the model
    int64 distilled = 6;        // distill: groups asked so far
    int64 distilled_facts = 7;  // finished: every distilled fact
    int64 clusters = 8;         // finished: distilled facts behind more than one potential fact
    int64 clustered_facts = 9;  // finished: the potential facts those group
    int64 dissolved = 10;       // groups the model said do not state one claim
    int64 failed = 11;          // groups the model could not be asked about
    int64 withheld = 12;        // groups with communications, not sent to an off-box model
    string model = 13;
    string distill_model = 14;
    string graph = 15;          // finished: the AGE projection, empty where the server has no AGE
    repeated string errors = 16;
    string message = 17;
    bool full = 18;             // the corpus was regrouped rather than new facts placed
    int64 documents = 19;       // documents whose facts were compared with each other
    int64 restatements = 20;    // potential facts restating another of their own document
    int64 nodes = 21;           // representatives placed (incremental) or grouped (full)
    int64 attached = 22;        // new facts that joined a distilled fact
    int64 accepted = 23;        // groups tight enough to keep without asking the model
    int64 candidates = 24;      // grow: groups grown so far
}

message ListFactPromptsRequest {}

// One effective fact prompt: a built-in (as overridden by facts.prompts) or a
// configured one.
message FactPrompt {
    string name = 1;
    string description = 2;
    string examples_json = 3;  // JSON array: [{"text", "extractions": [{"class", "text", "attributes"}]}]
    repeated string corpus_classes = 4;  // empty = all
    repeated string sources = 5;         // empty = all
    bool enabled = 6;
    bool builtin = 7;
    bool customized = 8;  // a built-in with an entry in facts.prompts
    string sha256 = 9;    // hex hash of description + examples, as stored on its facts
}

message ListFactPromptsResponse {
    repeated FactPrompt prompts = 1;  // built-ins first, then facts.prompts order
    string configured_json = 2;       // facts.prompts of the config in use, a JSON array (what SetSetting writes)
}

// ---------------------------------------------------------------------------
// Schema & Settings
// ---------------------------------------------------------------------------

message InitDbRequest {
    string schema_dir = 1;  // empty = the bundled schema
}

message InitDbResponse {
    repeated string applied = 1;
    string message = 2;
}

message GetSettingRequest {
    string name = 1;  // SECTION.KEY, e.g. facts.model
}

message GetSettingResponse {
    string name = 1;
    string value_json = 2;
}

message SetSettingRequest {
    string name = 1;
    string value = 2;  // as on the command line: true/false, numbers, comma-separated lists
    string path = 3;   // config file; empty = the one in use, else ~/.garage.json
}

message SetSettingResponse {
    string name = 1;
    string value_json = 2;
    string path = 3;
}

// ---------------------------------------------------------------------------
// MCP Client Registration
// ---------------------------------------------------------------------------

message McpInstallRequest {
    string target = 1;       // a client key; default "project"
    string path = 2;         // write this config file instead of a known target
    bool all = 3;            // every detected client config
    string name = 4;         // server name; default "garage-rag"
    bool stdio = 5;          // register a spawned command instead of the HTTP URL
    string host = 6;
    int32 port = 7;
    string route = 8;
    bool force = 9;
    bool dry_run = 10;
}

message McpTargetOutcome {
    string key = 1;
    string label = 2;
    string path = 3;
    bool written = 4;
    bool created_file = 5;
    bool replaced_entry = 6;
    string backup_path = 7;
    string skipped = 8;
    string preview_json = 9;
}

message McpInstallResponse {
    string url = 1;
    string command = 2;
    repeated string args = 3;
    bool fell_back = 4;
    repeated McpTargetOutcome outcomes = 5;
    string message = 6;
}

message McpUninstallRequest {
    string target = 1;
    string path = 2;
    string name = 3;
}

message McpUninstallResponse {
    string path = 1;
    bool removed = 2;
    string message = 3;
}

message McpStatusRequest {}

message McpClientInfo {
    string key = 1;
    string label = 2;
    string path = 3;
    bool registered = 4;
    bool config_exists = 5;
}

message McpStatusResponse {
    string server_command = 1;
    repeated McpClientInfo clients = 2;
}

// ---------------------------------------------------------------------------
// Database Facade for Ingest Workers
// ---------------------------------------------------------------------------

message BeginIngestSessionRequest {
    string source_slug = 1;
    bool include_code = 2;
}

message BeginIngestSessionResponse {
    int64 source_id = 1;
    string slug = 2;
    string root = 3;
    string default_class = 4;
    string default_trust = 5;
    // The cloud OCR fallback and its per-source switch were removed.
    reserved 6;
    reserved "allow_cloud_enrichment";
    int64 run_id = 7;
    repeated string source_slugs = 8;
    string kind = 9;  // filesystem | git | sqlite | maildir: picks the scanner
}

message PersistScanRequest {
    string source_slug = 1;
    int64 item_count = 2;
    string item_type = 3;
    double duration_seconds = 4;
    // Field 5 was map<string, int64> details; a scanner's details hold lists, nested tables and
    // strings too (the sqlite scanner's database names and table counts, a root problem), which
    // that map could not carry.
    reserved 5;
    string error = 6;
    // The scanner's details as a JSON object, stored verbatim in sources.scan_details.
    string details_json = 7;
}

message PersistScanResponse {
    bool success = 1;
}

message CheckDocumentStatRequest {
    string source_slug = 1;
    string uri = 2;
}

message CheckDocumentStatResponse {
    bool exists = 1;
    int64 byte_size = 2;
    double mtime = 3;
    string content_sha256 = 4;
    string chunker = 5;
    string state = 6;
    string source_sha256 = 7;
}

message DocumentAuthorPayload {
    string name = 1;
    string role = 2;
    float confidence = 3;
    string evidence = 4;
    map<string, string> identities = 5;
    bool is_self = 6;
}

message DocumentChunkPayload {
    int32 ord = 1;
    string text = 2;
    int32 token_count = 3;
    // Unset when unknown: 0 is a real offset, so it cannot mean "none".
    optional int32 char_start = 4;
    optional int32 char_end = 5;
    string heading_path = 6;
    string chunk_sha256 = 7;
    string chunker = 8;
    // Message chunks only (chunks.direction/sender); empty otherwise.
    string direction = 9;
    string sender = 10;
}

message PersistDocumentRequest {
    int64 run_id = 1;
    string source_slug = 2;
    string uri = 3;
    string action = 4;
    string title = 5;
    string lang = 6;
    int64 byte_size = 7;
    double mtime = 8;
    string source_sha256 = 9;
    string content_sha256 = 10;
    string extractor = 11;
    string extractor_version = 12;
    string chunker = 13;
    string content = 14;
    string meta_json = 15;
    string corpus_class = 16;
    string trust_tier = 17;
    string error = 18;
    repeated DocumentAuthorPayload authors = 19;
    repeated DocumentChunkPayload chunks = 20;
}

message PersistDocumentResponse {
    bool success = 1;
    int32 chunks_written = 2;
    string error = 3;
}

message FinalizeIngestSessionRequest {
    int64 run_id = 1;
    bool completed = 2;
    int64 seen_count = 3;
    int64 indexed_count = 4;
    int64 skipped_count = 5;
    int64 failed_count = 6;
    int64 placeholder_count = 7;
    int64 materialized_count = 8;
    int64 materialized_bytes = 9;
    repeated string errors = 10;
}

message FinalizeIngestSessionResponse {
    bool success = 1;
}

message EmbeddingChunkItem {
    int64 chunk_id = 1;
    string text = 2;
}

message GetEmbeddingBatchesRequest {
    string model_slug = 1;
    int32 batch_size = 2;
    int32 limit = 3;
}

message GetEmbeddingBatchesResponse {
    string model_slug = 1;
    string table_name = 2;
    string provider = 3;
    string model_ref = 4;
    int32 dims = 5;
    int32 stored_dims = 6;
    string storage_kind = 7;
    string index_kind = 8;
    int64 total_pending = 9;
    repeated EmbeddingChunkItem chunks = 10;
    bool has_more = 11;
    // text | image. For an image model each chunk's `text` is the path of the image
    // file to embed, not text.
    string modality = 12;
}

message ChunkEmbeddingItem {
    int64 chunk_id = 1;
    repeated float vector = 2;
}

message UpdateEmbeddingsRequest {
    string model_slug = 1;
    repeated ChunkEmbeddingItem embeddings = 2;
}

message UpdateEmbeddingsResponse {
    bool success = 1;
    int32 count = 2;
    string error = 3;
}
