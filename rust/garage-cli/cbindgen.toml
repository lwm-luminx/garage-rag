# include/garage_cli.h, written by `cargo run -p headergen` from src/lib.rs.
language = "C"
style = "both"
documentation_style = "c99"
cpp_compat = true
include_guard = "GARAGE_CLI_H"
no_includes = true
autogen_warning = "// Generated by `cargo run -p headergen` (cbindgen) from rust/garage-cli. Do not edit."
header = """
// The `garage` command line and the `garage-mcp` stdio server, linked in-process: each is a C
// `main` the launchers call with their own argc and argv, after setting the environment the
// service reads (GARAGE_DATABASE_URL, GARAGE_SQL_DIR, GARAGE_MODEL_MANIFEST, GARAGE_MCP_EXECUTABLE,
// GARAGE_GRPC_SOCKET, GARAGE_LLAMA_SOCKET). Both run GarageService in the calling process.
//
// Built from rust/garage-cli: libgarage_cli.a (static, for the Mac app's launcher helpers)."""

[fn]
args = "horizontal"
