# include/garage_embed.h, written by `cargo run -p headergen` from src/lib.rs.
language = "C"
style = "both"
documentation_style = "c99"
cpp_compat = true
# Swift imports size_t as Int, as the hosts expect; uintptr_t would be UInt.
usize_is_size_t = true
include_guard = "GARAGE_EMBED_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
autogen_warning = "// Generated by `cargo run -p headergen` (cbindgen) from rust/garage-embed-ffi. Do not edit."
header = """
// Garage's embed worker, linked in-process: embeds the chunks each model has no vectors for.
//
// The worker reaches the database only through GarageService (GetEmbeddingBatches,
// UpdateEmbeddings, BackfillDistilled in proto/garage.proto), and the model servers only through
// the host below. Requests, results and host calls are UTF-8 JSON. Every result string is freed
// with garage_embed_string_free. A call runs on the calling thread, and the host's functions are
// called on that thread only.
//
// Built from rust/garage-embed-ffi: libgarage_embed_ffi.a (static, for the Mac app) and
// libgarage_embed_ffi.{dylib,so,dll} (shared, for .NET and Python)."""

[export]
exclude = ["BACKENDS"]

[export.rename]
HostCall = "GarageEmbedHostCall"

[fn]
args = "horizontal"
