[package]
name = "uniffi-bindgen"
description = "UniFFI's binding generator at the workspace's uniffi version: Swift (and Python) bindings from a built library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
