[package]
name = "garage-ingest-ffi"
description = "The ingest pieces linked in-process: a C ABI over JSON, for Swift, .NET and Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "garage_ingest_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["tesseract"]
# As garage-readers' feature: the Windows build of the DLL turns it off until the app ships Tesseract.
tesseract = ["garage-readers/tesseract"]

[dependencies]
garage-git.workspace = true
garage-ingest.workspace = true
garage-readers = { workspace = true, default-features = false }
serde_json.workspace = true

[lints]
workspace = true
