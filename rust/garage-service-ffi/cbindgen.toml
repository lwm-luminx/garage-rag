# include/garage_service.h, written by `cargo run -p headergen` from src/lib.rs.
language = "C"
style = "both"
documentation_style = "c99"
cpp_compat = true
# Swift imports size_t as Int, as the hosts expect; uintptr_t would be UInt.
usize_is_size_t = true
include_guard = "GARAGE_SERVICE_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
autogen_warning = "// Generated by `cargo run -p headergen` (cbindgen) from rust/garage-service-ffi. Do not edit."
header = """
// GarageService, linked in-process: the gRPC backend the app, the workers and the MCP server read
// the corpus and persist through (proto/garage.proto), over Postgres + pgvector.
//
// The service reaches the model servers only through the host below (LlamaXPCService over NSXPC,
// Ollama and LM Studio with the system's HTTP stack, image models over NSXPC); it decides what is
// asked and where it may go. Requests, results and host calls are UTF-8 JSON. Every result string
// is freed with garage_service_string_free. The host's functions are called from the server's
// threads, several at once, from the start of a server to the return of its stop.
//
// Built from rust/garage-service-ffi: libgarage_service_ffi.a (static, for the Mac app) and
// libgarage_service_ffi.{dylib,so,dll} (shared, for .NET and Python)."""

[export.rename]
HostCall = "GarageServiceHostCall"

[fn]
args = "horizontal"
