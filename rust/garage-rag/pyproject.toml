# `garage_rag` on PyPI: Garage in one platform wheel. The package (python/garage_rag) is
# hand-written Python that keeps the pure-Python 1.5.0 package's names and calls the UniFFI bindings
# maturin generates in `garage_rag._native` (src/lib.rs: `garage_cli`, `garage_embed`), all
# over one shared library (docs/plans/python-package-parity.md). maturin generates the bindings with
# the workspace's own uniffi-bindgen (rust/uniffi-bindgen), so they match the library's scaffolding.
#
#     tools/wheels/build_libgit2.sh /tmp/libgit2 && export GARAGE_LIBGIT2_DIR=/tmp/libgit2
#     cd rust/garage-rag && maturin build --release
#
# .github/workflows/release.yaml builds the wheels and publishes them by trusted publishing. The
# version is this crate's (Cargo.toml), which is the app's release version, never set here.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "garage_rag"
description = "Local-first personal RAG over Postgres + pgvector, with authorship attribution and an MCP server: the garage CLI, the garage-mcp server and the embed worker, in Rust."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rick Mark-Penwell" }]
keywords = ["embeddings", "mcp", "pgvector", "postgres", "rag", "search"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Text Processing :: Indexing",
]

[project.scripts]
garage = "garage_rag.cli:main_cli"
garage-mcp = "garage_rag.mcp_server.server:main"

[project.urls]
Homepage = "https://garagerag.app"
Repository = "https://github.com/lwm-luminx/garage-rag"
Issues = "https://github.com/lwm-luminx/garage-rag/issues"

[tool.maturin]
bindings = "uniffi"
# The generated bindings and the library land in garage_rag/_native; the hand-written modules import them.
module-name = "garage_rag._native"
python-source = "python"
