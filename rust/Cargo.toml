# Garage's Rust: the components moved out of Python, and the plugins they host.
# See docs/plans/rust-plugins.md.
[workspace]
resolver = "3"
members = [
    "garage-cli",
    "garage-cli-uniffi",
    "garage-embed",
    "garage-embed-ffi",
    "garage-embed-uniffi",
    "garage-facade",
    "garage-git",
    "garage-ingest",
    "garage-ingest-ffi",
    "garage-mcp",
    "garage-mcp-ffi",
    "garage-ocr",
    "garage-plugin",
    "garage-rag",
    "garage-readers",
    "garage-service",
    "garage-service-ffi",
    "garage-text",
    "garage-text-ffi",
    "garage-text-plugin",
    "headergen",
    "protogen",
    "uniffi-bindgen",
]
# protogen needs protoc; everything else builds without it.
default-members = [
    "garage-cli",
    "garage-cli-uniffi",
    "garage-embed",
    "garage-embed-ffi",
    "garage-embed-uniffi",
    "garage-facade",
    "garage-git",
    "garage-ingest",
    "garage-ingest-ffi",
    "garage-mcp",
    "garage-mcp-ffi",
    "garage-ocr",
    "garage-plugin",
    "garage-rag",
    "garage-readers",
    "garage-service",
    "garage-service-ffi",
    "garage-text",
    "garage-text-ffi",
    "garage-text-plugin",
    # maturin runs it (`cargo run --bin uniffi-bindgen`) to generate garage-rag's Python bindings.
    "uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/lwm-luminx/garage-rag"
publish = false

[workspace.dependencies]
garage-embed = { path = "garage-embed" }
garage-cli-uniffi = { path = "garage-cli-uniffi" }
garage-embed-uniffi = { path = "garage-embed-uniffi" }
garage-facade = { path = "garage-facade" }
garage-git = { path = "garage-git" }
garage-ingest = { path = "garage-ingest" }
garage-mcp = { path = "garage-mcp" }
garage-ocr = { path = "garage-ocr", default-features = false }
garage-readers = { path = "garage-readers", default-features = false }
garage-service = { path = "garage-service" }
garage-plugin = { path = "garage-plugin" }
garage-text = { path = "garage-text" }
indexmap = "2.14"
# LangExtract's prompt, parse and alignment steps (no I/O of its own) behind EnrichFacts' FactExtractor.
langextract-rs = "0.1.0"
libc = "0.2"
# Apple Messages' chat.db, thread by thread: the FOSS markdown-extract crates (docs/plans/rust-plugins.md).
messages-markdown = "0.1.0"
# The readers for mail, PDF and Office files, from the same markdown-extract crates.
mail-markdown = "0.2.0"
office-markdown = "0.2.0"
pdf-markdown = "0.2.0"
# The PDF parser under pdf-markdown, for the structural checks before it reads a file (garage-readers).
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
# Keyed archives in Messages' NickNameCache, read through the SQLite messages-markdown bundles.
plist = "1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
prost = "0.14"
regex = "1.13"
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
unicode-normalization = "0.1.26"
yaml-rust2 = { version = "0.13", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
# The MCP server's streamable HTTP transport (rust/garage-mcp): hyper is already under tonic.
bytes = "1.12"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
tower = "0.5"
# The Rust GarageService (rust/garage-service, docs/plans/python-removal.md): pure-Rust Postgres.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The XPC hosts' bindings (docs/plans/uniffi.md). uniffi-bindgen must stay on the same version.
uniffi = { version = "0.32", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# The prose names Python and its libraries (PyYAML, pathlib) as words, not code.
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
# macOS 27's dyld rejects a Mach-O that rustc's rust-objcopy stripped ("mis-aligned LINKEDIT string
# pool"), as .bazelrc's -Cstrip=none says; the garage_rag wheel's library would not load.
strip = "none"
