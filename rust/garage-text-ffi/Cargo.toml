[package]
name = "garage-text-ffi"
description = "The text reader linked in-process: a C ABI over garage.plugin.v1's serialized messages, for Swift, .NET and Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "garage_text_ffi"
# A static library for the Mac app (linked at build time, nothing loaded at run time) and a
# shared one for .NET's P/Invoke and Python's ctypes.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
garage-plugin.workspace = true
garage-text.workspace = true

[dev-dependencies]
prost.workspace = true

[lints]
workspace = true
