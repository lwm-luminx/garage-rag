# include/garage_text.h, written by `cargo run -p headergen` from src/lib.rs (and garage-plugin's GarageBuffer).
language = "C"
style = "both"
documentation_style = "c99"
cpp_compat = true
# Swift imports size_t as Int, as the hosts expect; uintptr_t would be UInt.
usize_is_size_t = true
include_guard = "GARAGE_TEXT_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
autogen_warning = "// Generated by `cargo run -p headergen` (cbindgen) from rust/garage-text-ffi. Do not edit."
header = """
// Garage's text reader (plain text, Markdown, source code), linked in-process.
//
// Each call takes a serialized garage.plugin.v1 request message (proto/garage_plugin.proto) and
// fills `response` with the serialized response message, the same messages the reader's gRPC
// process serves. A status other than GARAGE_TEXT_OK means `response` holds a UTF-8 explanation
// instead. Free every filled buffer with garage_text_buffer_free. Every call is thread-safe.
//
// Built from rust/garage-text-ffi: libgarage_text_ffi.a (static, for the Mac app) and
// libgarage_text_ffi.{dylib,so,dll} (shared, for .NET and Python)."""

[parse]
parse_deps = true
include = ["garage-plugin"]

[export]
# garage-plugin's own names for the statuses, which this crate re-exports as GARAGE_TEXT_*.
exclude = ["STATUS_OK", "STATUS_BAD_REQUEST", "STATUS_PANIC", "CONTRACT"]

[fn]
args = "horizontal"
