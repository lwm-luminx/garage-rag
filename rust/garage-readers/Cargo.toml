[package]
name = "garage-readers"
description = "Garage's file readers in Rust: text, Markdown and code (garage-text), mail, PDF and Office (the FOSS markdown-extract crates), pictures (garage-ocr), other documents through the Mac's Spotlight importers (garage-spotlight), and the names iMessage contacts shared."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tesseract"]
# Pictures read with Tesseract where Vision is not there (Linux, Windows): needs libtesseract at build
# time (garage-ocr's build.rs). Off, a picture reads as no text on those platforms.
tesseract = ["garage-ocr/tesseract"]

[dependencies]
garage-ingest.workspace = true
garage-spotlight.workspace = true
garage-ocr = { workspace = true, default-features = false, features = ["vision"] }
garage-text.workspace = true
mail-markdown.workspace = true
office-markdown.workspace = true
pdf-markdown.workspace = true
pdf_oxide.workspace = true
plist.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

[lints]
workspace = true
