title: Garage
tagline: Private local RAG and MCP server for your Mac
description: "Garage indexes your documents, code and messages on your Mac and serves them to your AI assistant over MCP. Local-first: your files and the index stay on your Mac."
url: "https://garagerag.app"
baseurl: ""
lang: en_US

# jekyll-seo-tag ({% seo %} in _layouts/default.html): canonical URLs, Open Graph and X/Twitter
# cards, and JSON-LD. The social card is drawn by tools/screenshots/social_card.py.
logo: /assets/logo.png
author:
  name: Rick Mark-Penwell
  url: https://garagerag.app/about.html
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-card.png

# The public TestFlight invitation for the App Store build (https://testflight.apple.com/join/...).
# While it is empty, /testflight.html says testing hasn't opened, asks search engines not to index
# it, and nothing else on the site links to it. Set it here and every entry point appears.
testflight_url: "https://testflight.apple.com/join/fjCMVpjK"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Navigation
header_pages:
  - index.md
  - support/index.md
  - support/guide.md
  - support/troubleshooting.md
  - support/faq.md
  - support/privacy-policy.md
  - support/contact.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Jekyll skips dot-directories; .data holds files the app and editors fetch from the site
# (models.json, which the build copies in from data/models, and garage.schema.json).
include:
  - .data

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - BUILD.bazel
  - BUILD
  # Design notes and research, kept in the repo but not published
  - plans
