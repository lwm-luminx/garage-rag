title: Garage
description: Garage is a local-first personal RAG and knowledge indexing app for macOS. It indexes your documents, code and messages on your Mac and serves them to your AI assistant over MCP. Download, user guide, troubleshooting, FAQ and privacy documentation.
url: "https://garagerag.app"
baseurl: ""

# The public TestFlight invitation for the App Store build (https://testflight.apple.com/join/...).
# While it is empty, /testflight.html says testing hasn't opened, asks search engines not to index
# it, and nothing else on the site links to it. Set it here and every entry point appears.
testflight_url: "https://testflight.apple.com/join/fjCMVpjK"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Navigation
header_pages:
  - index.md
  - support/index.md
  - support/guide.md
  - support/troubleshooting.md
  - support/faq.md
  - support/privacy-policy.md
  - support/contact.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Jekyll skips dot-directories; .data holds files the app and editors fetch from the site
# (models.json, garage.schema.json).
include:
  - .data

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - BUILD.bazel
  - BUILD
