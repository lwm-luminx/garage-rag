<text x="286" y="140" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="302" y="141" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Read</text>
<text x="280" y="164" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">Text from every</text>
<text x="280" y="180" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">file, OCR scans</text>
