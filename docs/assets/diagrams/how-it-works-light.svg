<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="title">How Garage works</title>
<desc id="desc">Your folders, git repositories, documents, Messages and Mail, and cloud folders feed Garage on your Mac. Garage reads each file, attributes it, splits it into passages and embeds them with on-device models, storing everything in a private PostgreSQL and pgvector library. Hybrid search over that library is served over MCP: your AI assistant asks a question and gets back only the excerpts it searched for. Garage uploads nothing.</desc>
