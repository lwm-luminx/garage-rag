<text x="888" y="347" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Your AI assistant</text>
<text x="862" y="372" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">Claude, ChatGPT,</text>
<text x="862" y="388" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">Cursor, LM Studio</text>
<text x="862" y="404" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">or any MCP client</text>
<path d="M847 354H757.0" fill="none" stroke="#656d76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-arrow)"/>
<path d="M757.0 386H847" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-accent)"/>
