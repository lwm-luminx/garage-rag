<text x="792" y="406" font-size="12" font-weight="600" fill="#0969da" text-anchor="start">excerpts</text>
<text x="850" y="224" font-size="12" font-weight="600" fill="#0969da" text-anchor="start">It gets only the excerpts</text>
<text x="850" y="240" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">it searched for. Cloud</text>
<text x="850" y="256" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">assistants send those to</text>
<text x="850" y="272" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">their provider; a local model</text>
<text x="850" y="288" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">keeps them on your Mac.</text>
